{% extends "base.html" %}

{% block title %}Login — Loucomotiva{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="hero-brand" style="font-size:2.2rem">Login admin</h1>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-danger">Usuário ou senha inválidos.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuário</label>
        <input type="text" name="username" autofocus class="form-control" required id="id_username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Senha</label>
        <input type="password" name="password" class="form-control" required id="id_password">
      </div>
      <button type="submit" class="btn btn-accent w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
