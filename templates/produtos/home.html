{% extends "base.html" %}
{% load static %}

{% block title %}Loucomotiva — Loja{% endblock %}

{% block content %}
<section class="mb-4">
  <h1 class="hero-brand">KIT 2026</h1>
  <p class="hero-lead">Garanta já o seu!</p>
</section>

{{ catalogo_json|json_script:"catalogo-data" }}
{{ carrinho_json|json_script:"carrinho-data" }}
<div
  id="loja-root"
  data-page="vitrine"
  data-checkout-url="{% url 'pedidos:finalizar' %}"
  data-home-url="{% url 'produtos:home' %}"
  data-placeholder="{% static 'images/produtos/placeholder.svg' %}"
  {% if abrir_carrinho %}data-open-cart="1"{% endif %}
></div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'frontend/loja.js' %}"></script>
{% endblock %}
